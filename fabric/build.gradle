plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

// Fabric 模块直接编译公共源码，因此要提供 Minecraft、官方映射加 Parchment 参数名、Fabric Loader 与 API。
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // 内嵌 Baritone 的源码引用 javax.annotation 注解与 ASM；加载器重编译 common 源码时也要在类路径上。
    compileOnly group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    compileOnly group: 'org.ow2.asm', name: 'asm', version: '9.7.1'
    compileOnly group: 'org.ow2.asm', name: 'asm-tree', version: '9.7.1'

    // SQLite 驱动与 HTML 解析器打进 Mod 的 Jar 里（include = 嵌入依赖）。
    include(implementation("org.xerial:sqlite-jdbc:${sqlite_jdbc_version}"))
    include(implementation("org.jsoup:jsoup:${jsoup_version}"))
}

// 配置可选访问扩展、Mixin 映射文件，以及开发时的客户端与服务器启动方式。
loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            vmArg '-Xmx3072M'
            programArgs '--width', '1280', '--height', '720'
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
        // headless 的游戏内测试：fabric-api 的 gametest 开关把专用服务器入口换成测试服务端，
        // 跑完注册的全部 GameTest 自动退出，有失败构建变红。共用 common 的共享核对动作与结构模板。
        gametest {
            server()
            setConfigName('Fabric GameTest')
            ideConfigGenerated(true)
            runDir('runs/gametest')
            vmArg '-Dfabric-api.gametest=true'
        }
    }
}

// 游戏内测试的 Fabric 入口与共享核对动作、结构模板一起编译进主 Jar（Fabric 的 entrypoint 在
// 生产环境也要能解析，测试类随 Jar 发布是 Fabric 的惯例，没有被测试运行用到时不做事）。
tasks.named('compileJava', JavaCompile) {
    source project(':common').file('src/gametest/java')
}
sourceSets.main.resources.srcDir project(':common').file('src/gametest/resources')
